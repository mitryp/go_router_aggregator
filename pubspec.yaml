name: go_router_aggregator
description: >
  Aggregates GoRouter's generated type-safe routes into one importable file,
  separating your route declarations from the router setup.
version: 2.1.0
repository: https://github.com/mitryp/go_router_aggregator

environment:
  sdk: ^3.7.0

dependencies:
  build: ^4.0.0
  dart_style: ^3.0.0
  glob: ^2.1.3
  path: ^1.9.0
  pub_semver: ^2.1.4

dev_dependencies:
  build_runner: ^2.6.0
  build_test: ^3.4.1
  test: ^1.26.2

topics:
  - codegen
  - go-router
  - navigation
  - build-runner
